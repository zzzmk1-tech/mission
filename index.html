<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root { --bg:#f3f6f1; --card:#fff; --ink:#1f2a24; --sub:#6b746e; --accent:#2f8f5b; --accent2:#7cc49a;
      --soft:#e6f4ec; --wait:#e08a12; --waitsoft:#fff3df; --line:#e2e7e2; --hero1:#3aa56c; --hero2:#8fd3a8; }
    body.kid-daughter { --bg:#f4f3fb; --accent:#6a5acd; --accent2:#a99ef0; --soft:#eeebfc; --hero1:#6a5acd; --hero2:#b6a9f5; }
    body.parent { --bg:#fbf8ef; --accent:#b8860b; --soft:#fff6d8; --wait:#e2622b; --waitsoft:#ffece3; --line:#ece4cf;
      --hero1:#f2b705; --hero2:#ffdf6e; }
    body.parent .hero { color:#3b2f00; }
    body.parent .tab.on, body.parent .btn.ok { color:#fff; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
    .wrap { max-width:480px; margin:0 auto; padding:16px 16px 48px; }
    h1 { font-size:22px; margin:0 0 4px; }
    h2 { font-size:18px; margin:24px 0 10px; }
    .date { color:var(--sub); margin-bottom:16px; }

    .hero { position:relative; overflow:hidden; color:#fff; border-radius:24px; padding:20px 18px 18px; margin-bottom:14px;
      background:linear-gradient(135deg, var(--hero1), var(--hero2)); box-shadow:0 8px 20px -10px var(--hero1); }
    .hero h1 { font-size:24px; margin:2px 0; }
    .hero .hello { font-size:15px; opacity:.9; }
    .hero h1, .hero .hello, .hero .when { padding-right:64px; position:relative; }
    .hero .when { font-size:14px; opacity:.85; }
    .hero .mascot { position:absolute; right:14px; top:10px; font-size:58px; transform:rotate(-8deg); }
    .hero .bubble { position:absolute; right:-30px; bottom:-40px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,.15); }
    .prog { margin-top:16px; position:relative; }
    .prog-l { display:flex; justify-content:space-between; font-size:14px; font-weight:600; margin-bottom:6px; }
    .bar { height:12px; border-radius:99px; background:rgba(255,255,255,.3); overflow:hidden; }
    .bar i { display:block; height:100%; border-radius:99px; background:#fff; transition:width .5s; }

    .points { display:flex; gap:10px; margin-bottom:16px; }
    .pt { flex:1; background:var(--card); border-radius:18px; padding:12px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .pt b { display:block; font-size:26px; color:var(--accent); }
    .pt span { font-size:13px; color:var(--sub); }

    .tabs { display:flex; gap:6px; margin-bottom:16px; background:var(--card); padding:5px; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .tab { flex:1; font:inherit; font-size:15px; padding:10px 6px; border-radius:12px; border:0; background:transparent; color:var(--sub); }
    .tab.on { background:var(--accent); color:#fff; font-weight:600; }

    .sec { font-size:14px; font-weight:700; color:var(--sub); margin:18px 4px 8px; }
    .m { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card);
      border:2px solid transparent; border-radius:20px; padding:14px; margin-bottom:10px; font:inherit; color:inherit;
      box-shadow:0 2px 10px rgba(0,0,0,.06); transition:transform .1s; }
    .m:active { transform:scale(.98); }
    .m.pending { border-color:var(--wait); background:var(--waitsoft); }
    .m.approved { border-color:var(--accent); background:var(--soft); }
    .ico { flex:none; width:46px; height:46px; border-radius:14px; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:26px; }
    .m.pending .ico { background:#fff; }
    .m.approved .ico { background:#fff; }
    .box { flex:none; width:34px; height:34px; border-radius:50%; border:2.5px solid var(--line);
      display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:#fff; }
    .m.pending .box { background:var(--wait); border-color:var(--wait); animation:pop .3s; }
    .m.approved .box { background:var(--accent); border-color:var(--accent); }
    @keyframes pop { 0% { transform:scale(.4); } 70% { transform:scale(1.2); } 100% { transform:scale(1); } }
    .body { flex:1; min-width:0; }
    .t { font-size:17px; font-weight:700; }
    .d { font-size:13px; color:var(--sub); margin-top:3px; }
    .tag { display:inline-block; font-size:12px; font-weight:700; margin-top:6px; padding:3px 8px; border-radius:99px; }
    .pending .tag { color:#fff; background:var(--wait); }
    .approved .tag { color:#fff; background:var(--accent); }
    .p { flex:none; font-size:14px; font-weight:800; color:var(--accent); background:var(--soft); padding:6px 10px; border-radius:99px; }
    .m.approved .p, .m.pending .p { background:#fff; }
    .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:99px; margin-left:6px; vertical-align:2px;
      background:#fff1c9; color:#9a6a00; }

    .pick { display:block; width:100%; padding:22px; margin-bottom:12px; font:inherit; font-size:20px; font-weight:700;
      background:var(--card); border:0; border-radius:20px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .rest { background:var(--card); border-radius:20px; padding:28px; text-align:center; color:var(--sub); font-size:16px; }
    .rest .big { font-size:48px; margin-bottom:8px; }
    .msg { text-align:center; color:var(--sub); padding:40px 0; }
    .msg .big { font-size:40px; display:block; margin-bottom:8px; animation:bob 1s infinite alternate; }
    @keyframes bob { to { transform:translateY(-6px); } }
    .hint { background:var(--waitsoft); color:#8a5a00; border-radius:14px; padding:10px 12px; font-size:14px; margin-bottom:12px; }

    .cheer { background:var(--card); border:2px solid var(--accent); border-radius:20px; padding:16px; margin-bottom:14px; font-size:16px; line-height:1.6;
      box-shadow:0 6px 16px -10px var(--accent); animation:pop .4s; }
    .cheer-t { font-size:20px; font-weight:800; color:var(--accent); margin-bottom:6px; }
    .cheer b { color:var(--accent); }
    .cheer-s { margin-top:6px; font-weight:700; }
    .bonus { display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,#fff7d6,#ffe9a8); border-radius:20px; padding:14px; margin-bottom:10px; font-size:15px; }
    .bonus .ico { background:#fff; }
    .bonus b { color:#9a6a00; }

    .row { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
      border-radius:14px; padding:12px; margin-bottom:8px; }
    .row .info { flex:1; }
    .row .info small { display:block; color:var(--sub); }
    .btn { font:inherit; font-size:14px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:#fff; }
    .btn.ok { background:var(--accent); border-color:var(--accent); color:#fff; }
    .done-mark { color:var(--accent); font-weight:600; font-size:14px; }
    .wait-mark { color:var(--sub); font-size:14px; }
    .row.pending { border-color:var(--wait); background:var(--waitsoft); }
    .row.approved { border-color:var(--accent); background:var(--soft); }
    .erow { display:flex; align-items:center; gap:6px; padding:8px 0; border-top:1px solid var(--line); margin-top:6px; }
    .erow .info { flex:1; font-size:15px; }
    .erow .info small { display:block; color:var(--sub); font-size:13px; }
    .btn.add { width:100%; margin-top:8px; border-style:dashed; color:var(--sub); }
    .lbl { display:block; font-size:13px; color:var(--sub); margin:10px 0 4px; }
    .inp { width:100%; font:inherit; font-size:16px; padding:10px; border-radius:10px; border:1px solid var(--line); background:#fff; }
    .daypick { display:flex; flex-wrap:wrap; gap:10px; font-size:16px; }
    h2 .sub { font-size:14px; font-weight:400; color:var(--sub); }

    .day { background:var(--card); border-radius:18px; padding:14px 16px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.05); border:2px solid transparent; }
    .day.today { border-color:var(--accent); }
    .day b { font-size:17px; }
    .day .note { color:var(--sub); font-size:13px; margin-left:6px; }
    .day .now { font-size:12px; font-weight:700; color:#fff; background:var(--accent); border-radius:99px; padding:2px 8px; margin-left:6px; vertical-align:2px; }
    .day ul, .guide ul, .guide ol { margin:6px 0 0; padding-left:20px; }
    .day li, .guide li { margin:3px 0; }
    .guide { background:var(--card); border-radius:18px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .guide h3 { margin:0 0 4px; font-size:17px; color:var(--accent); display:inline; }
    details.guide summary { cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; }
    details.guide summary::-webkit-details-marker { display:none; }
    details.guide summary:after { content:'▾'; color:var(--sub); transition:transform .2s; }
    details.guide[open] summary:after { transform:rotate(180deg); }
    details.guide[open] summary { margin-bottom:6px; }
    .guide p { margin:4px 0; color:var(--sub); font-size:14px; }
    .when-t { display:inline-block; font-size:12px; color:var(--sub); margin-top:6px; margin-left:6px; }
    .cal-head { display:flex; align-items:center; justify-content:space-between; margin:0 4px 10px; }
    .cal-head b { font-size:18px; }
    .cal-nav { font:inherit; font-size:18px; width:40px; height:40px; border-radius:12px; border:0; background:var(--card); box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .cal-total { background:var(--card); border-radius:18px; padding:12px; text-align:center; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .cal-total b { font-size:26px; color:var(--accent); }
    .cal { display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; background:var(--card); border-radius:18px; padding:10px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .cal .dn { text-align:center; font-size:12px; color:var(--sub); padding:2px 0 4px; }
    .cal .dn.sun { color:#d9534f; }
    .cell { min-height:58px; border-radius:12px; padding:5px 2px; text-align:center; background:var(--bg); display:flex; flex-direction:column; align-items:center; gap:2px; }
    .cell .n { font-size:12px; color:var(--sub); }
    .cell .v { font-size:13px; font-weight:800; color:var(--accent); }
    .cell .e { font-size:13px; line-height:1; }
    .cell.done { background:var(--soft); }
    .cell.today { outline:2px solid var(--accent); }
    .cell.future, .cell.blank { background:transparent; }
    .cal-legend { font-size:12px; color:var(--sub); margin:10px 4px; text-align:center; }
    .wk { background:var(--card); border-radius:18px; padding:4px 14px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .wk-sum { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 10px; }
    .chip { font-size:13px; background:var(--card); border-radius:99px; padding:5px 10px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
    .chip b { color:var(--accent); }
    .wkd { padding:10px 0; border-top:1px solid var(--line); }
    .wkd:first-child { border-top:0; }
    .wkd-h { display:flex; justify-content:space-between; font-weight:700; cursor:pointer; list-style:none; }
    .wkd-h::-webkit-details-marker { display:none; }
    .wkd-h .pts:after { content:' ▾'; color:var(--sub); font-weight:400; }
    .wkd[open] .wkd-h { margin-bottom:4px; }
    .wkd-h .pts { color:var(--accent); }
    .wkd.future { opacity:.45; }
    .wkd.today .wkd-h span:first-child:after { content:' · 오늘'; color:var(--accent); font-size:12px; }
    .wkd.future .wkd-h .pts:after { content:''; }
    .wki { font-size:14px; margin-top:4px; display:flex; gap:6px; }
    .wki small { color:var(--sub); }
    .rules { background:var(--card); border-radius:18px; padding:14px 16px; margin:16px 0; font-size:15px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .rules summary { font-weight:700; cursor:pointer; }
    .rules ul { margin:10px 0 0; padding-left:20px; }
    .rules li { margin:5px 0; }
    .toast { position:fixed; left:16px; right:16px; bottom:20px; background:#333; color:#fff; border-radius:12px; padding:12px 14px; font-size:14px; text-align:center; z-index:99; }
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="msg"><span class="big">🚀</span>불러오는 중…</div></div>
  <script>
    var KID = '<?= kid ?>';
    var PARENT_KEY = '<?= parentKey ?>';
    var PARENT_MODE = '<?= parentMode ?>';

    // 깃허브 페이지에서 열면 (구글 밖) 웹앱을 주소로 불러요. 아이 구글 계정이 만 13세 미만이어도 열리게
    // 쿠키 없이(credentials: omit) 부르는 게 중요해요.
    var API_URL = 'https://script.google.com/macros/s/AKfycbwuSrzkEBAv1Bnr74_DulKxS5ylLN3Fbe78PHnMBbjxef680qhcidPUZewQSylVHoD5pw/exec';
    var STANDALONE = !(window.google && google.script);
    if (STANDALONE) {
      var q = new URLSearchParams(location.search);
      KID = /^(son|daughter)$/.test(q.get('kid') || '') ? q.get('kid') : '';
      PARENT_MODE = q.get('mode') === 'parent' ? 'yes' : '';
      PARENT_KEY = '';
      var vp = document.createElement('meta');
      vp.name = 'viewport'; vp.content = 'width=device-width, initial-scale=1, maximum-scale=1';
      document.head.appendChild(vp);
      document.title = '오늘의 미션';
      window.google = { script: { get run() { return runner(); } } };
    }
    function runner() {
      var ok = function () {}, bad = function () {};
      var r = {
        withSuccessHandler: function (f) { ok = f; return r; },
        withFailureHandler: function (f) { bad = f; return r; },
      };
      ['getToday', 'toggleMission', 'getParentView', 'parentAction',
       'getMissionConfig', 'addMission', 'updateMission', 'deleteMission', 'getCalendar', 'getWeekReport'].forEach(function (fn) {
        r[fn] = function () {
          var args = Array.prototype.slice.call(arguments);
          var url = API_URL + '?api=call&fn=' + fn + '&args=' + encodeURIComponent(JSON.stringify(args)) + '&t=' + Date.now();
          fetch(url, { credentials: 'omit' })
            .then(function (res) { return res.json(); })
            .then(function (o) { if (o.ok) ok(o.data); else bad(new Error(o.error)); })
            .catch(function () { bad(new Error('인터넷 연결을 확인해 주세요')); });
        };
      });
      return r;
    }
    var app = document.getElementById('app');
    var busy = false;
    var VIEW = 'today';
    var CHEER = null; // 이번에 열었을 때 받은 축하 소식 (다시 열기 전까지 유지)
    var LAST = null;
    var DAYS = ['일','월','화','수','목','금','토'];

    // 소율 공부법: 과목별로 접었다 펼쳐 봐요
    var GUIDE = [
      { t: '📌 매번 같은 순서', p: '완료 기준은 시간이 아니라 결과물이에요. 단위는 이번 주 학교에서 배운 소단원 하나.', open: true, items: [
        '50분 날: 복습 → 한 장 요약 → 소단원 문제 → 오답 정리',
        '30분 날(월·목): 복습 → 기본 문제 → 오답 (요약은 다음 50분 날에)',
        '한 장 요약: 책을 덮고 기억나는 걸 공책 한 쪽에 쓰고, 책과 비교해 빠진 걸 다른 색으로 채우기',
        '오답 정리: 틀린 문제만 오답 노트에 옮기고, 왜 틀렸는지 한 줄 쓰기',
        '시간이 한참 지나도 덜 끝났으면 멈추고, 남은 건 다음 시간에 이어서 해도 돼요',
        'EBS 강의는 막힐 때만: 이해 안 되는 부분 강의를 보고 나서 요약하기 (보너스 +10)'] },
      { t: '✏️ 국어 (월 30분 · 금 50분)', p: '"읽고 근거 찾기"만 꾸준히 해도 달라져요.', items: [
        '월: 지난주 배운 소단원 본문을 소리 내어 읽기 → 모르는 낱말 뜻 찾아 적기 → 기본 문제',
        '금: 단원 첫 쪽 학습 목표부터 확인 (시험은 여기서 나와요)',
        '시: 말하는 이, 분위기, 표현법(비유·반복 등)',
        '소설: 인물·사건·배경·갈등을 4칸 표로',
        '설명문·논설문: 문단마다 중심 문장 한 줄',
        '틀린 문제는 정답의 근거가 되는 문장을 본문에서 찾아 밑줄'] },
      { t: '🔤 영어 (화 50분 + 단어 화·수·금·토)', p: '단어는 자주, 본문과 문법은 화요일에.', items: [
        '단어: 30개 소리 내어 3번 읽기 → 가리고 뜻 쓰기 → 워크북으로 확인',
        '틀린 단어는 다음 단어 날 맨 먼저 다시 시험',
        '화: 본문 듣기 → 소리 내어 3번 읽기 → 한 문장씩 해석',
        '해석만 보고 영어 문장으로 다시 써 보기',
        '단원 문법은 예문 2개를 통째로 외우기 → 문제집'] },
      { t: '🔬 과학 (수 50분 · 주말 하루 50분)', p: '외우기보다 그림으로 이해해요. 주말 과학은 토·일 중 하루만 하면 돼요.', items: [
        '수: 교과서 그림·도표를 공책에 따라 그리고 설명 달기',
        '핵심 용어를 내 말로 설명해 보기 (엄마나 동생에게 설명해도 좋아요)',
        '주말: 그 주 내용을 마인드맵 한 장으로 요약',
        '실험은 목적 → 과정 → 결과 → 결론 4칸 표로'] },
      { t: '🌏 사회 (목 30분)', p: '용어와 흐름을 잡아요.', items: [
        '빈 종이에 소단원 목차를 안 보고 써 보기',
        '용어 카드 5장 만들기: 앞면 용어, 뒷면 뜻',
        '지리 단원은 사회과부도에서 위치 찾기',
        '그래프·지도 문제는 제목과 단위부터 읽기'] },
    ];

    function tabs(isDaughter) {
      var list = [['today','오늘'],['cal','이번 달'],['week','요일별']];
      if (isDaughter) list.push(['study','공부법']);
      return '<div class="tabs">' + list.map(function (x) {
        return '<button class="tab' + (VIEW === x[0] ? ' on' : '') + '" onclick="go(\'' + x[0] + '\')">' + x[1] + '</button>';
      }).join('') + '</div>';
    }
    function go(v) { VIEW = v; if (v === 'cal') return loadCal(); if (LAST) renderKid(LAST); }

    // ----- 아이 달력 -----
    var CALMONTH = '', CAL = null;
    function loadCal(delta) {
      if (delta && CAL) {
        var y = Number(CAL.month.slice(0, 4)), m = Number(CAL.month.slice(5)) + delta;
        if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
        CALMONTH = y + '-' + (m < 10 ? '0' : '') + m;
      }
      google.script.run.withSuccessHandler(function (c) { CAL = c; renderCal(); }).withFailureHandler(fail).getCalendar(KID, CALMONTH);
    }
    function renderCal() {
      var html = (LAST ? heroHtml(LAST) : '') + tabs(KID === 'daughter');
      html += '<div class="cal-head"><button class="cal-nav" onclick="loadCal(-1)">‹</button><b>' + esc(CAL.label) + '</b>' +
        '<button class="cal-nav" onclick="loadCal(1)">›</button></div>';
      html += '<div class="cal-total">이번 달 모은 포인트<br><b>' + CAL.total + '</b></div>';
      html += '<div class="cal">' + ['일','월','화','수','목','금','토'].map(function (d, i) {
        return '<div class="dn' + (i === 0 ? ' sun' : '') + '">' + d + '</div>'; }).join('');
      var lead = CAL.days[0].dow % 7; // 일요일 시작
      for (var i = 0; i < lead; i++) html += '<div class="cell blank"></div>';
      CAL.days.forEach(function (d) {
        var cls = 'cell' + (d.future ? ' future' : '') + (d.today ? ' today' : '') + (d.points > 0 ? ' done' : '');
        var emo = d.weekBonus ? '🏆' : d.allCore ? '⭐' : (d.checked && !d.future ? '·' : '');
        html += '<div class="' + cls + '"><span class="n">' + d.day + '</span>' +
          (d.points > 0 ? '<span class="v">' + d.points + '</span>' : '') + (emo ? '<span class="e">' + emo + '</span>' : '') + '</div>';
      });
      html += '</div><div class="cal-legend">⭐ 기본 미션 다 한 날 · 🏆 주간 보너스 · 숫자는 엄마가 확인한 포인트</div>';
      app.innerHTML = html;
    }

    function weekHtml(data) {
      var todayName = DAYS[new Date().getDay()];
      var html = '';
      data.week.forEach(function (d) {
        html += '<div class="day' + (d.day === todayName ? ' today' : '') + '"><b>' + d.day + '요일</b>' +
          (d.day === todayName ? '<span class="now">오늘</span>' : '') +
          (d.note ? '<span class="note">' + esc(d.note) + '</span>' : '');
        html += d.missions.length
          ? '<ul>' + d.missions.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>'
          : '<div class="d">쉬는 날</div>';
        html += '</div>';
      });
      return html;
    }

    function studyHtml() {
      return '<div class="date" style="margin:0 4px 10px">필요한 과목만 눌러서 펼쳐 보세요</div>' + GUIDE.map(function (g) {
        return '<details class="guide"' + (g.open ? ' open' : '') + '><summary><h3>' + g.t + '</h3></summary><p>' + g.p + '</p><ul>' +
          g.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></details>';
      }).join('');
    }

    function rulesHtml(rules, title) {
      if (!rules || !rules.length) return '';
      return '<details class="rules"><summary>' + esc(title) + '</summary><ul>' +
        rules.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul></details>';
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function fail(err) { busy = false; app.innerHTML = '<div class="msg">문제가 생겼어요. 다시 열어주세요.<br>' + esc(err.message || err) + '</div>'; }

    // ----- 아이 화면 -----
    function pickScreen() {
      app.innerHTML = '<h1>누구예요?</h1><div class="date">이름을 눌러주세요</div>' +
        '<button class="pick" onclick="choose(\'son\')">우재</button>' +
        '<button class="pick" onclick="choose(\'daughter\')">소율</button>';
    }
    function choose(k) { KID = k; loadKid(); }

    var THEME = {
      son: { mascot: '🦎', hello: '안녕, 우재!' },
      daughter: { mascot: '📚', hello: '안녕, 소율!' },
    };
    var ICONS = [[/강의|인강/, '📺'], [/연산|계산/, '🔢'], [/수학/, '📐'], [/독해|독서|책/, '📖'], [/파닉스|EBS|영어|듀오/, '🔤'],
      [/단어/, '📝'], [/국어/, '✏️'], [/과학/, '🔬'], [/사회/, '🌏'], [/놀기|놀|끝냈/, '⚽'], [/태권/, '🥋']];
    function iconFor(title) {
      for (var i = 0; i < ICONS.length; i++) if (ICONS[i][0].test(title)) return ICONS[i][1];
      return '⭐';
    }

    function heroHtml(data) {
      var th = THEME[KID] || { mascot: '⭐', hello: '안녕!' };
      var core = data.missions.filter(function (m) { return m.kind === '기본'; });
      var done = core.filter(function (m) { return m.state !== 'none'; }).length;
      var pct = core.length ? Math.round(done / core.length * 100) : 100;
      var label = !core.length ? '오늘은 쉬는 날' : done === core.length ? '기본 미션 끝! 최고야 🎉' : '기본 미션 ' + done + ' / ' + core.length;
      return '<div class="hero"><div class="bubble"></div><div class="mascot">' + th.mascot + '</div>' +
        '<div class="hello">' + esc(th.hello) + '</div><h1>' + esc(data.title) + '</h1><div class="when">' + esc(data.date) + '</div>' +
        (VIEW === 'today' && core.length ? '<div class="prog"><div class="prog-l"><span>' + label + '</span><span>' + pct + '%</span></div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div></div>' : '') + '</div>';
    }

    function missionHtml(m) {
      var tag = m.otherDay ? m.otherDay + '요일에 했어요' : m.state === 'pending' ? '엄마 확인 기다리는 중' : m.state === 'approved' ? '엄마 확인 완료!' : '';
      var badge = m.kind === '보너스' ? '<span class="badge">선택</span>' : m.kind === '완료보너스' ? '<span class="badge">보너스</span>' : '';
      var st = m.otherDay ? 'other' : m.state;
      return '<button class="m ' + m.state + '" onclick="toggle(\'' + m.id + '\',\'' + st + '\')">' +
        '<div class="ico">' + iconFor(m.title) + '</div>' +
        '<div class="body"><div class="t">' + esc(m.title) + badge + '</div><div class="d">' + esc(m.detail) + '</div>' +
        (tag ? '<div class="tag">' + tag + '</div>' : '') +
        (m.checkedAt ? '<span class="when-t">⏰ ' + esc(m.checkedAt) + ' 체크</span>' : '') + '</div>' +
        '<div class="p">+' + m.points + '</div><div class="box">' + (m.state !== 'none' ? '✓' : '') + '</div></button>';
    }

    function renderKid(data) {
      LAST = data;
      document.body.className = 'kid-' + KID;
      var head = heroHtml(data) + tabs(KID === 'daughter');
      if (VIEW === 'cal') { if (CAL) renderCal(); else loadCal(); return; }
      if (VIEW === 'week') { app.innerHTML = head + weekHtml(data); return; }
      if (VIEW === 'study') { app.innerHTML = head + studyHtml(); return; }
      var waiting = data.missions.filter(function (m) { return m.state === 'pending'; }).length;
      var html = head +
        '<div class="points"><div class="pt"><b>' + data.todayPoints + '</b><span>오늘 받은 포인트</span></div>' +
        '<div class="pt"><b>' + data.monthPoints + '</b><span>이번 달</span></div></div>';
      if (data.celebrate && data.celebrate.length) CHEER = (CHEER || []).concat(data.celebrate);
      if (CHEER) {
        var sum = CHEER.reduce(function (a, c) { return a + (c.points || 0); }, 0);
        html += '<div class="cheer"><div class="cheer-t">🎉 엄마가 확인했어요!</div>' +
          CHEER.map(function (c) { return '<div>' + esc(c.title) + ' <b>+' + c.points + '</b></div>'; }).join('') +
          '<div class="cheer-s">모두 +' + sum + '점. 잘했어요!</div></div>';
      }
      if (waiting) html += '<div class="hint">⏳ 엄마 확인을 기다리는 미션 ' + waiting + '개. 확인되면 포인트가 들어와요.</div>';
      if (!data.missions.length) html += '<div class="rest"><div class="big">😴</div>오늘은 쉬는 날이에요. 푹 쉬어요!</div>';
      var core = data.missions.filter(function (m) { return m.kind === '기본'; });
      var weekend = data.missions.filter(function (m) { return m.kind === '주말'; });
      var extra = data.missions.filter(function (m) { return m.kind !== '기본' && m.kind !== '주말'; });
      if (core.length) html += '<div class="sec">오늘 꼭 할 미션</div>' + core.map(missionHtml).join('');
      if (weekend.length) html += '<div class="sec">주말 미션 · 토·일 중 하루만 하면 돼요</div>' + weekend.map(missionHtml).join('');
      if (extra.length) html += '<div class="sec">더 하면 포인트 UP</div>' + extra.map(missionHtml).join('');
      if (data.bonus) html += '<div class="bonus"><div class="ico">🌟</div><div>기본 미션을 모두 해서<br><b>다 했어요 보너스 +' + data.bonus + '</b></div></div>';
      if (data.weekBonus) html += '<div class="bonus"><div class="ico">🏆</div><div>이번 주 하루도 안 빼고 해서<br><b>주간 보너스 +' + data.weekBonus + '</b></div></div>';
      html += rulesHtml(data.rules, '💡 포인트 받는 방법');
      app.innerHTML = html;
    }

    // 빠르게 보이도록: 오늘 받은 화면을 폰에 저장해 두고, 열 때 먼저 보여준 뒤 새로 받아와요
    function localDay() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
    function saveKid(data) {
      try { localStorage.setItem('today_' + KID, JSON.stringify({ day: localDay(), data: Object.assign({}, data, { celebrate: [] }) })); } catch (e) {}
    }
    function cachedKid() {
      try {
        var c = JSON.parse(localStorage.getItem('today_' + KID) || 'null');
        return c && c.day === localDay() ? c.data : null;
      } catch (e) { return null; }
    }
    function gotKid(data) { saveKid(data); if (!INFLIGHT.length) renderKid(data); }

    function loadKid() {
      if (!KID) return pickScreen();
      var c = cachedKid();
      if (c) renderKid(c);
      google.script.run.withSuccessHandler(gotKid).withFailureHandler(c ? function () {} : fail).getToday(KID);
    }

    var INFLIGHT = [], KSEQ = 0;
    function nowHM() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
    function toast(msg) {
      var t = document.createElement('div');
      t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 3000);
    }

    // 누르면 화면부터 바로 바꾸고, 저장은 뒤에서 해요
    function toggle(id, state) {
      if (state === 'approved' || state === 'other' || INFLIGHT.indexOf(id) >= 0 || !LAST) return;
      LAST.missions.forEach(function (m) {
        if (m.id !== id) return;
        m.state = m.state === 'none' ? 'pending' : 'none';
        m.checkedAt = m.state === 'pending' ? nowHM() : '';
      });
      INFLIGHT.push(id);
      renderKid(LAST);
      var seq = ++KSEQ;
      var done = function () { INFLIGHT = INFLIGHT.filter(function (x) { return x !== id; }); };
      google.script.run.withSuccessHandler(function (d) {
          done();
          if (INFLIGHT.length) return;
          if (seq === KSEQ) gotKid(d); else google.script.run.withSuccessHandler(gotKid).withFailureHandler(function () {}).getToday(KID);
        })
        .withFailureHandler(function (e) {
          done();
          toast('저장이 안 됐어요. 다시 눌러 주세요' + (e && e.message ? ' (' + e.message + ')' : ''));
          google.script.run.withSuccessHandler(gotKid).withFailureHandler(fail).getToday(KID);
        }).toggleMission(KID, id);
    }

    // ----- 엄마 화면 -----
    function parentRow(kid, it, showDate) {
      var args = "'" + kid + "','" + it.date + "','" + it.mission + "'";
      var btns;
      if (it.state === 'approved') {
        btns = '<span class="done-mark">확인 완료</span>' +
          '<button class="btn" onclick="act(' + args + ',\'unapprove\')">확인 취소</button>';
      } else if (it.state === 'pending') {
        btns = '<button class="btn" onclick="act(' + args + ',\'reject\')">취소</button>' +
          '<button class="btn ok" onclick="act(' + args + ',\'approve\')">확인</button>';
      } else if (it.state === 'other') {
        btns = '<span class="wait-mark">' + esc(it.otherDay) + '요일에 함</span>';
      } else {
        btns = '<span class="wait-mark">아직 안 함</span>';
      }
      var sub = [showDate ? it.date : '', it.checkedAt ? '⏰ ' + it.checkedAt + ' 체크' : ''].filter(Boolean).join(' · ');
      return '<div class="row ' + it.state + '"><div class="info">' + esc(it.title) +
        (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>' + btns + '</div>';
    }

    var PVIEW = 'check', EKID = 'son', CFG = null, EDIT = null;

    function parentTabs() {
      return '<div class="tabs">' + [['check','미션 확인'],['report','이번 주'],['edit','미션 수정']].map(function (x) {
        return '<button class="tab' + (PVIEW === x[0] ? ' on' : '') + '" onclick="pgo(\'' + x[0] + '\')">' + x[1] + '</button>';
      }).join('') + '</div>';
    }
    function pgo(v) { PVIEW = v; EDIT = null; if (v === 'edit') loadConfig(); else if (v === 'report') loadReport(); else loadParent(); }

    // ----- 엄마: 이번 주 -----
    function loadReport() {
      google.script.run.withSuccessHandler(renderReport).withFailureHandler(fail).getWeekReport(PARENT_KEY);
    }
    function renderReport(r) {
      var mark = { approved: '✅', pending: '🟠', none: '⬜', other: '↔️' };
      var html = parentHero('이번 주 ' + esc(r.range)) + parentTabs();
      r.kids.forEach(function (k) {
        html += '<h2>' + esc(k.name) + '</h2><div class="wk-sum">' +
          '<span class="chip">이번 주 <b>' + k.total + '점</b></span>' +
          '<span class="chip">기본 미션 다 한 날 <b>' + k.doneDays + '/' + k.coreDays + '</b></span>' +
          (k.pending ? '<span class="chip">확인 기다림 <b>' + k.pending + '</b></span>' : '') +
          (k.weekBonus ? '<span class="chip">🏆 주간 보너스</span>' : '') +
          '<span class="chip">칭찬모아 미지급 <b>' + k.unpaid + '점</b></span></div><div class="wk">';
        k.days.forEach(function (d) {
          if (!d.items.length && !d.points) return;
          var waits = d.items.filter(function (it) { return it.state === 'pending'; }).length;
          html += '<details class="wkd' + (d.future ? ' future' : '') + (d.today ? ' today' : '') + '"' + (d.today ? ' open' : '') +
            '><summary class="wkd-h"><span>' + d.day + ' ' + d.md + (d.allCore ? ' ⭐' : '') + (waits ? ' 🟠' + waits : '') +
            '</span><span class="pts">' + (d.future ? '' : d.points + '점') + '</span></summary>';
          d.items.forEach(function (it) {
            if (it.kind === '보너스' && it.state === 'none') return; // 안 한 선택 미션은 빼요
            var note = it.state === 'other' ? it.otherDay + '요일에 함' : it.checkedAt ? it.checkedAt + ' 체크' : '';
            html += '<div class="wki"><span>' + (d.future && it.state === 'none' ? '·' : mark[it.state]) + '</span><span>' + esc(it.title) +
              (note ? ' <small>' + esc(note) + '</small>' : '') + '</span></div>';
          });
          html += '</details>';
        });
        html += '</div>';
      });
      html += '<div class="cal-legend">✅ 엄마 확인 · 🟠 확인 기다림 · ⬜ 안 함 · ⭐ 기본 미션 다 한 날</div>';
      app.innerHTML = html;
    }

    var PLAST = null;
    function renderParent(data) {
      PLAST = data;
      var html = parentHero(esc(data.date) + ' · 확인한 미션만 포인트로 들어가요') + parentTabs();
      data.kids.forEach(function (k) {
        html += '<h2>' + esc(k.name) + ' <span class="sub">오늘 ' + k.todayPoints + '점 · 이번 달 ' + k.monthPoints + '점</span></h2>';
        if (!k.today.length) html += '<div class="rest">오늘은 쉬는 날이에요</div>';
        k.today.forEach(function (it) { html += parentRow(k.kid, it, false); });
        if (k.bonus) html += '<div class="row approved"><div class="info">다 했어요 보너스<small>기본 미션을 모두 확인해서 자동으로 들어가요</small></div><span class="done-mark">+' + k.bonus + '</span></div>';
        if (k.weekBonus) html += '<div class="row approved"><div class="info">주간 보너스<small>이번 주 기본 미션을 하루도 안 빼고 해서 자동으로 들어가요</small></div><span class="done-mark">+' + k.weekBonus + '</span></div>';
        if (k.past.length) {
          html += '<div class="date" style="margin-top:10px">지난 미션 중 확인 안 한 것</div>';
          k.past.forEach(function (it) { html += parentRow(k.kid, it, true); });
        }
        html += rulesHtml(k.rules, k.name + ' 포인트 규칙');
      });
      app.innerHTML = html;
    }

    function parentHero(sub) {
      document.body.className = 'parent';
      return '<div class="hero"><div class="bubble"></div><div class="mascot">🌻</div><h1>엄마 확인</h1><div class="when">' + sub + '</div></div>';
    }

    function keyScreen(msg) {
      app.innerHTML = parentHero(msg || '비밀번호를 입력해 주세요') +
        '<input id="pw" type="password" style="width:100%;font-size:18px;padding:14px;border-radius:12px;border:1px solid var(--line);margin-bottom:12px">' +
        '<button class="pick" onclick="tryKey()">들어가기</button>';
    }
    function tryKey() {
      PARENT_KEY = document.getElementById('pw').value.trim();
      loadParent();
    }
    function loadParent() {
      if (!PARENT_KEY) { try { PARENT_KEY = localStorage.getItem('parentKey') || ''; } catch (e) {} }
      if (!PARENT_KEY) return keyScreen();
      google.script.run.withSuccessHandler(function (d) {
        try { localStorage.setItem('parentKey', PARENT_KEY); } catch (e) {}
        renderParent(d);
      }).withFailureHandler(function () {
        try { localStorage.removeItem('parentKey'); } catch (e) {}
        PARENT_KEY = '';
        keyScreen('비밀번호가 맞지 않아요. 다시 입력해 주세요');
      }).getParentView(PARENT_KEY);
    }

    // 엄마도 누르면 화면부터 바로 바뀌어요. 여러 개를 연달아 눌러도 돼요
    var PIN = [], PSEQ = 0;
    function act(kid, date, mission, action) {
      var key = kid + '|' + date + '|' + mission;
      if (PIN.indexOf(key) >= 0 || !PLAST) return;
      if (action === 'reject' && !confirm('아이의 체크를 지울까요?')) return;
      if (action === 'unapprove' && !confirm('확인을 취소할까요? 포인트에서 빠져요.')) return;
      var next = { approve: 'approved', reject: 'none', unapprove: 'pending' }[action];
      PLAST.kids.forEach(function (k) {
        if (k.kid !== kid) return;
        k.today.forEach(function (it) { if (it.date === date && it.mission === mission) { it.state = next; if (next === 'none') it.checkedAt = ''; } });
        k.past = k.past.filter(function (it) { return !(it.date === date && it.mission === mission); });
      });
      renderParent(PLAST);
      PIN.push(key);
      var seq = ++PSEQ;
      var done = function () { PIN = PIN.filter(function (x) { return x !== key; }); };
      google.script.run.withSuccessHandler(function (d) {
        done();
        if (PIN.length || PVIEW !== 'check') return;
        if (seq === PSEQ) renderParent(d); else loadParent();
      }).withFailureHandler(function () {
        done();
        toast('저장이 안 됐어요. 다시 해 주세요');
        if (PVIEW === 'check') loadParent();
      }).parentAction(PARENT_KEY, kid, date, mission, action);
    }


    // ----- 엄마: 미션 수정 -----
    function loadConfig() {
      google.script.run.withSuccessHandler(renderConfig).withFailureHandler(fail).getMissionConfig(PARENT_KEY);
    }

    function kindLabel(k) { return k === '기본' ? '' : (k === '보너스' ? '보너스' : '완료보너스'); }

    function formHtml(kidCfg) {
      var m = { title: '', detail: '', points: 20, kind: '기본' };
      if (EDIT.mode === 'edit') {
        kidCfg.days.forEach(function (d) { if (d.dow === EDIT.dow) d.missions.forEach(function (x) { if (x.id === EDIT.id) m = x; }); });
      }
      var html = '<div class="guide"><h3>' + (EDIT.mode === 'add' ? '미션 추가' : DAYS_FULL[EDIT.dow] + ' 미션 고치기') + '</h3>' +
        '<label class="lbl">미션 이름</label><input id="f-title" class="inp" value="' + esc(m.title) + '">' +
        '<label class="lbl">설명 (아이에게 보이는 안내)</label><input id="f-detail" class="inp" value="' + esc(m.detail) + '">' +
        '<label class="lbl">포인트</label><input id="f-points" class="inp" type="number" min="0" value="' + m.points + '">' +
        '<label class="lbl">종류</label><select id="f-kind" class="inp">' + CFG.kinds.map(function (k) {
          return '<option' + (k === m.kind ? ' selected' : '') + '>' + k + '</option>';
        }).join('') + '</select>' +
        '<p>기본: 꼭 할 미션 · 보너스: 하면 더 받는 선택 미션 · 완료보너스: 기본 미션을 다 한 날만 포인트 · 주말: 토·일에 같이 넣으면 하루만 하면 돼요</p>';
      if (EDIT.mode === 'add') {
        html += '<label class="lbl">요일 (여러 개 고를 수 있어요)</label><div class="daypick">';
        for (var d = 1; d <= 7; d++) {
          html += '<label><input type="checkbox" class="f-day" value="' + d + '"' + (d === EDIT.dow ? ' checked' : '') + '> ' + DAYS_FULL[d].slice(0, 1) + '</label>';
        }
        html += '</div>';
      }
      html += '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1" onclick="EDIT=null;renderConfig(CFG)">닫기</button>' +
        '<button class="btn ok" style="flex:2" onclick="saveForm()">저장</button></div></div>';
      return html;
    }

    function renderConfig(cfg) {
      busy = false;
      CFG = cfg;
      var kidCfg = cfg.kids.filter(function (k) { return k.kid === EKID; })[0];
      var html = parentHero('요일별 미션을 고치면 바로 아이 화면에 반영돼요') + parentTabs();
      html += '<div class="tabs">' + cfg.kids.map(function (k) {
        return '<button class="tab' + (EKID === k.kid ? ' on' : '') + '" onclick="EKID=\'' + k.kid + '\';EDIT=null;renderConfig(CFG)">' + esc(k.name) + '</button>';
      }).join('') + '</div>';
      if (EDIT) html += formHtml(kidCfg);
      kidCfg.days.forEach(function (d) {
        html += '<div class="day"><b>' + d.day + '요일</b>';
        if (!d.missions.length) html += '<div class="d">미션 없음</div>';
        d.missions.forEach(function (m) {
          var args = d.dow + ",'" + m.id + "'";
          html += '<div class="erow"><div class="info">' + esc(m.title) +
            '<small>' + m.points + '점' + (kindLabel(m.kind) ? ' · ' + kindLabel(m.kind) : '') + '</small></div>' +
            '<button class="btn" onclick="startEdit(' + args + ')">수정</button>' +
            '<button class="btn" onclick="removeMission(' + args + ')">삭제</button></div>';
        });
        html += '<button class="btn add" onclick="startAdd(' + d.dow + ')">+ 미션 추가</button></div>';
      });
      app.innerHTML = html;
      if (EDIT) window.scrollTo(0, 0);
    }

    var DAYS_FULL = ['', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];
    function startAdd(dow) { EDIT = { mode: 'add', dow: dow }; renderConfig(CFG); }
    function startEdit(dow, id) { EDIT = { mode: 'edit', dow: dow, id: id }; renderConfig(CFG); }

    function saveForm() {
      if (busy) return;
      var m = { title: document.getElementById('f-title').value, detail: document.getElementById('f-detail').value,
        points: document.getElementById('f-points').value, kind: document.getElementById('f-kind').value };
      if (!m.title.trim()) { alert('미션 이름을 적어주세요'); return; }
      var run = google.script.run.withSuccessHandler(function (c) { EDIT = null; renderConfig(c); })
        .withFailureHandler(function (e) { busy = false; alert(e.message || e); });
      busy = true;
      if (EDIT.mode === 'add') {
        var days = Array.prototype.slice.call(document.querySelectorAll('.f-day:checked')).map(function (x) { return Number(x.value); });
        if (!days.length) { busy = false; alert('요일을 하나 이상 골라주세요'); return; }
        run.addMission(PARENT_KEY, EKID, days, m);
      } else {
        run.updateMission(PARENT_KEY, EKID, EDIT.dow, EDIT.id, m);
      }
    }

    function removeMission(dow, id) {
      if (busy || !confirm(DAYS_FULL[dow] + '에서 이 미션을 뺄까요? 이미 확인한 포인트는 그대로 남아요.')) return;
      busy = true;
      google.script.run.withSuccessHandler(function (c) { EDIT = null; renderConfig(c); })
        .withFailureHandler(function (e) { busy = false; alert(e.message || e); })
        .deleteMission(PARENT_KEY, EKID, dow, id);
    }

    if (PARENT_KEY || PARENT_MODE) loadParent(); else loadKid();
  </script>
</body>
</html>
